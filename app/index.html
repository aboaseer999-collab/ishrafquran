<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<title>نظام الإشراف</title>
<style>
html,body{margin:0;height:100%;background:#f6f3ec;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;color:#1f3b4d}
#ishraf-boot{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.ib-spin{width:44px;height:44px;border:4px solid #d9e6ea;border-top-color:#1f7a8c;border-radius:50%;animation:s 0.9s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.ib-card{background:#fff;border-radius:18px;padding:28px 24px;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(31,59,77,.08)}
.ib-card h1{font-size:20px;margin:0 0 10px}.ib-card p{margin:0 0 18px;line-height:1.8;color:#4b6270}
.ib-card button,.ib-card a{display:inline-block;margin:4px;padding:10px 18px;border-radius:12px;border:0;font:inherit;cursor:pointer;text-decoration:none}
.ib-card button{background:#1f7a8c;color:#fff}.ib-card a{background:#eef4f6;color:#1f3b4d}
</style>
</head>
<body>
<div id="ishraf-boot"><div><div class="ib-spin"></div><div>جارٍ التحميل…</div></div></div>
<script src="/app/loader.js"></script>
</body>
</html>
